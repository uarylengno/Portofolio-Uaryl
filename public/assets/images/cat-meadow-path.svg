  <path d="M 915 148 Q 940 138 965 150" stroke="#87c74d" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Center Distance Grass Bush -->
  <use href="#grassSprout" x="490" y="188" transform="scale(0.85)" />

