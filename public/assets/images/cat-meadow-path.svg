<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 357" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="meadowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2edca" />
      <stop offset="24%" stop-color="#fff5a0" />
      <stop offset="58%" stop-color="#fff5a0" />
      <stop offset="100%" stop-color="#fff7ae" />
    </linearGradient>

    <!-- Rolling Hills / Grass Gradient -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fc32b" />
      <stop offset="25%" stop-color="#8fbb19" />
      <stop offset="60%" stop-color="#a8cf35" />
      <stop offset="100%" stop-color="#c9e34c" />
    </linearGradient>

    <!-- Daisy Flower Definition -->
    <g id="daisyFlower">
      <circle cx="-2.5" cy="0" r="2.2" fill="#ffffff" />
      <circle cx="2.5" cy="0" r="2.2" fill="#ffffff" />
      <circle cx="0" cy="-2.5" r="2.2" fill="#ffffff" />
      <circle cx="0" cy="2.5" r="2.2" fill="#ffffff" />
      <circle cx="-1.8" cy="-1.8" r="2" fill="#ffffff" />
      <circle cx="1.8" cy="-1.8" r="2" fill="#ffffff" />
      <circle cx="-1.8" cy="1.8" r="2" fill="#ffffff" />
      <circle cx="1.8" cy="1.8" r="2" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.5" fill="#fbd341" />
    </g>

    <!-- Grass Sprout Definition -->
    <g id="grassSprout">
      <path d="M 0 0 Q -4 -10 -9 -14 Q -3 -8 0 0 Z" fill="#395c25" />
      <path d="M 0 0 Q -1 -12 -3 -18 Q 1 -10 0 0 Z" fill="#4a7630" />
      <path d="M 0 0 Q 3 -12 6 -17 Q 3 -9 0 0 Z" fill="#5b8c3b" />
      <path d="M 0 0 Q 5 -9 11 -13 Q 5 -7 0 0 Z" fill="#446f2b" />
    </g>
  </defs>

  <!-- ==========================================
       1. SKY BACKGROUND
       ========================================== -->
  <rect width="1024" height="200" fill="url(#meadowSky)" />

  <!-- ==========================================
       3. MEADOW GRASS GROUND (ROLLING HILLS)
       ========================================== -->
  <!-- Main Grass Base -->
  <path d="M 0 183 C 52 182, 91 177, 132 178 C 179 179, 211 188, 254 197 C 304 208, 351 209, 400 201 C 450 193, 487 181, 535 182 C 584 183, 621 193, 665 198 C 715 204, 757 198, 804 188 C 850 178, 888 176, 930 181 C 969 186, 997 190, 1024 184 L 1024 357 L 0 357 Z" fill="url(#grassGrad)" />
  <path d="M 0 183 C 52 182, 91 177, 132 178 C 179 179, 211 188, 254 197 C 304 208, 351 209, 400 201 C 450 193, 487 181, 535 182 C 584 183, 621 193, 665 198 C 715 204, 757 198, 804 188 C 850 178, 888 176, 930 181 C 969 186, 997 190, 1024 184" fill="none" stroke="#4a7629" stroke-width="1" opacity="0.55" />

  <!-- Subtle Rolling Grass Plains & Light Tonal Bands -->
  <path d="M 0 228 C 112 221, 193 225, 286 234 C 379 243, 455 242, 545 232 C 644 220, 717 222, 805 228 C 897 234, 959 231, 1024 225 L 1024 357 L 0 357 Z" fill="#b5d65a" opacity="0.2" />
