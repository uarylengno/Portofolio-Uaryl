<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 357" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="meadowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#9fc174" />
      <stop offset="35%" stopColor="#cde09e" />
      <stop offset="70%" stopColor="#edf5cb" />
      <stop offset="100%" stopColor="#e4efbb" />
    </linearGradient>

    <!-- Rolling Hills / Grass Gradient -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#7cb638" />
      <stop offset="25%" stopColor="#8bc044" />
      <stop offset="60%" stopColor="#9bca50" />
      <stop offset="100%" stopColor="#a3d259" />
    </linearGradient>

    <!-- Daisy Flower Definition -->
    <g id="daisyFlower">
      <circle cx="-2.5" cy="0" r="2.2" fill="#ffffff" />
      <circle cx="2.5" cy="0" r="2.2" fill="#ffffff" />
      <circle cx="0" cy="-2.5" r="2.2" fill="#ffffff" />
      <circle cx="0" cy="2.5" r="2.2" fill="#ffffff" />
      <circle cx="-1.8" cy="-1.8" r="2" fill="#ffffff" />
      <circle cx="1.8" cy="-1.8" r="2" fill="#ffffff" />
      <circle cx="-1.8" cy="1.8" r="2" fill="#ffffff" />
      <circle cx="1.8" cy="1.8" r="2" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.5" fill="#fbd341" />
    </g>

    <!-- Grass Sprout Definition -->
    <g id="grassSprout">
      <path d="M 0 0 Q -4 -10 -9 -14 Q -3 -8 0 0 Z" fill="#395c25" />
      <path d="M 0 0 Q -1 -12 -3 -18 Q 1 -10 0 0 Z" fill="#4a7630" />
      <path d="M 0 0 Q 3 -12 6 -17 Q 3 -9 0 0 Z" fill="#5b8c3b" />
      <path d="M 0 0 Q 5 -9 11 -13 Q 5 -7 0 0 Z" fill="#446f2b" />
    </g>
  </defs>

  <!-- ==========================================
       1. SKY BACKGROUND
       ========================================== -->
  <rect width="1024" height="200" fill="url(#meadowSky)" />

  <!-- ==========================================
       2. BUSHES (LEFT & RIGHT CLUSTERS)
       ========================================== -->
  <!-- Left Back Bush (Dark Emerald Green) -->
  <g fill="#2d5223" stroke="#213d19" stroke-width="2.5" stroke-linejoin="round">
    <path d="M -20 188 C -20 120, 40 100, 70 125 C 90 95, 145 95, 160 135 C 185 125, 205 150, 195 188 Z" />
  </g>
  <!-- Left Front Bush (Bright Lime-Moss Green) -->
  <g fill="#619934" stroke="#3e6b1e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 50 188 C 45 155, 75 135, 105 145 C 125 130, 160 140, 165 165 C 180 155, 198 170, 190 188 Z" />
  </g>
  <!-- Left Bush Highlights -->
  <path d="M 75 142 Q 100 132 125 140" stroke="#87c74d" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 130 150 Q 155 140 170 155" stroke="#87c74d" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Right Back Bush (Dark Emerald Green) -->
  <g fill="#2d5223" stroke="#213d19" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 825 188 C 820 145, 850 115, 885 125 C 905 90, 960 90, 985 130 C 1010 110, 1050 135, 1045 188 Z" />
  </g>
  <!-- Right Front Bush (Bright Lime-Moss Green) -->
  <g fill="#619934" stroke="#3e6b1e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 830 188 C 830 155, 855 140, 880 148 C 900 130, 940 135, 955 160 C 970 150, 995 165, 990 188 Z" />
  </g>
  <!-- Right Bush Highlights -->
  <path d="M 855 144 Q 880 134 905 142" stroke="#87c74d" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 915 148 Q 940 138 965 150" stroke="#87c74d" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Center Distance Grass Bush -->
  <use href="#grassSprout" x="490" y="188" transform="scale(0.85)" />

  <!-- ==========================================
       3. MEADOW GRASS GROUND (ROLLING HILLS)
       ========================================== -->
  <!-- Main Grass Base -->
  <rect y="186" width="1024" height="171" fill="url(#grassGrad)" />
  <line x1="0" y1="186" x2="1024" y2="186" stroke="#4a7629" stroke-width="1.5" />

  <!-- Subtle Rolling Grass Plains & Light Tonal Bands -->
  <path d="M 0 215 Q 260 200 520 220 T 1024 210 L 1024 357 L 0 357 Z" fill="#8bc044" opacity="0.35" />
  <path d="M 0 255 Q 320 240 680 260 T 1024 250 L 1024 357 L 0 357 Z" fill="#95c74c" opacity="0.4" />
  <path d="M 0 295 Q 280 280 620 300 T 1024 290 L 1024 357 L 0 357 Z" fill="#a1d056" opacity="0.45" />

  <!-- ==========================================
       4. THE MUD PUDDLE (KUBANGAN LUMPUR)
       ========================================== -->
  <!-- Layer 1: Dark Brown Shadow Border -->
  <path d="M 92 260 C 85 240, 130 225, 205 218 C 285 210, 360 200, 480 196 C 620 192, 740 198, 830 215 C 910 230, 940 250, 915 272 C 890 295, 830 305, 760 302 C 700 300, 680 318, 560 326 C 450 334, 340 332, 260 330 C 180 328, 140 315, 120 295 C 100 278, 88 270, 92 260 Z"
        fill="#5a371c" />

  <!-- Layer 2: Main Rich Mud Surface -->
  <path d="M 102 258 C 98 242, 138 228, 210 222 C 288 214, 365 204, 482 201 C 618 197, 735 203, 822 219 C 898 233, 925 251, 902 269 C 878 290, 822 299, 755 297 C 696 295, 672 312, 555 320 C 448 327, 342 325, 265 323 C 188 321, 150 309, 130 291 C 112 275, 100 268, 102 258 Z"
        fill="#7f5230" />

  <!-- Layer 3: Smooth Inner Silt / Mud Tone -->
  <path d="M 125 256 C 122 244, 158 233, 225 227 C 298 220, 372 212, 485 209 C 615 205, 725 211, 808 225 C 878 237, 902 253, 882 267 C 860 283, 810 292, 748 290 C 692 288, 665 303, 552 311 C 448 317, 348 316, 275 314 C 205 312, 168 302, 150 286 C 135 272, 124 266, 125 256 Z"
        fill="#986742" />

  <!-- Layer 4: Upper Mud Highlight Contour -->
  <path d="M 160 252 C 158 242, 190 234, 252 230 C 322 225, 395 218, 498 216 C 618 213, 715 218, 788 230 C 850 240, 872 253, 855 264 C 835 277, 790 285, 735 283 C 685 281, 655 294, 552 301 C 458 307, 368 306, 302 305 C 238 303, 202 295, 185 282 C 172 270, 162 262, 160 252 Z"
        fill="#aa774e" />

  <!-- Mud Water Depressions & Ripples -->
  <!-- Ripple 1 (Center Left) -->
  <ellipse cx="380" cy="242" rx="36" ry="11" fill="#7a4e2c" />
  <ellipse cx="379" cy="241" rx="33" ry="9" fill="#93623c" />
  <ellipse cx="378" cy="240" rx="27" ry="6" fill="#aa774f" />
  <path d="M 355 240 Q 378 236 400 240" stroke="#c08c62" stroke-width="1.8" fill="none" opacity="0.8" />

  <!-- Ripple 2 (Bottom Center) -->
  <ellipse cx="530" cy="275" rx="30" ry="9" fill="#7a4e2c" />
  <ellipse cx="529" cy="274" rx="27" ry="7.5" fill="#93623c" />
  <ellipse cx="528" cy="273" rx="21" ry="5" fill="#aa774f" />
  <path d="M 512 273 Q 528 270 545 273" stroke="#c08c62" stroke-width="1.8" fill="none" opacity="0.8" />

  <!-- Ripple 3 (Left Edge) -->
  <ellipse cx="260" cy="250" rx="24" ry="8" fill="#7a4e2c" />
  <ellipse cx="259" cy="249" rx="21" ry="6.5" fill="#93623c" />
  <ellipse cx="258" cy="248" rx="16" ry="4.5" fill="#aa774f" />

  <!-- Ripple 4 (Far Left Small) -->
  <ellipse cx="198" cy="265" rx="15" ry="5" fill="#7a4e2c" />
  <ellipse cx="197" cy="264" rx="12" ry="3.8" fill="#93623c" />

  <!-- Ripple 5 (Right Small) -->
  <ellipse cx="745" cy="244" rx="20" ry="6.5" fill="#7a4e2c" />
  <ellipse cx="744" cy="243" rx="17" ry="5" fill="#93623c" />

  <!-- Mud Satellite Droplets (Bottom Left) -->
  <ellipse cx="165" cy="305" rx="14" ry="5.5" fill="#5a371c" />
  <ellipse cx="165" cy="304" rx="12" ry="4.5" fill="#7f5230" />
  <ellipse cx="164" cy="303" rx="8" ry="3" fill="#986742" />

  <ellipse cx="200" cy="312" rx="12" ry="5" fill="#5a371c" />
  <ellipse cx="200" cy="311" rx="10" ry="4" fill="#7f5230" />

  <!-- Mud Satellite Droplets (Bottom Right) -->
  <ellipse cx="725" cy="302" rx="16" ry="6" fill="#5a371c" />
  <ellipse cx="725" cy="301" rx="14" ry="5" fill="#7f5230" />
  <ellipse cx="724" cy="300" rx="10" ry="3.5" fill="#986742" />

  <ellipse cx="765" cy="312" rx="13" ry="5" fill="#5a371c" />
  <ellipse cx="765" cy="311" rx="11" ry="4" fill="#7f5230" />

  <!-- ==========================================
       5. FLOWERS & GRASS TUFTS ON MEADOW
       ========================================== -->
  <!-- Grass Tufts -->
  <use href="#grassSprout" x="175" y="342" transform="scale(0.9)" />
  <use href="#grassSprout" x="625" y="330" transform="scale(0.85)" />
  <use href="#grassSprout" x="845" y="334" transform="scale(0.95)" />
  <use href="#grassSprout" x="80" y="215" transform="scale(0.75)" />

  <!-- Daisies Scattered Across Ground -->
  <use href="#daisyFlower" x="42" y="292" />
  <use href="#daisyFlower" x="155" y="272" />
  <use href="#daisyFlower" x="195" y="235" />
  <use href="#daisyFlower" x="420" y="322" />
  <use href="#daisyFlower" x="460" y="318" />
  <use href="#daisyFlower" x="700" y="328" />
  <use href="#daisyFlower" x="842" y="292" />
  <use href="#daisyFlower" x="872" y="235" />
  <use href="#daisyFlower" x="912" y="318" />
  <use href="#daisyFlower" x="982" y="242" />
  <use href="#daisyFlower" x="310" y="208" />
  <use href="#daisyFlower" x="660" y="212" />
</svg>