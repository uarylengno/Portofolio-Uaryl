  <ellipse cx="165" cy="305" rx="14" ry="5.5" fill="#70421f" />
  <ellipse cx="165" cy="304" rx="12" ry="4.5" fill="#975d36" />
  <ellipse cx="164" cy="303" rx="8" ry="3" fill="#b27649" />

  <ellipse cx="200" cy="312" rx="12" ry="5" fill="#70421f" />
  <ellipse cx="200" cy="311" rx="10" ry="4" fill="#975d36" />

  <!-- Mud Satellite Droplets (Bottom Right) -->
  <ellipse cx="725" cy="302" rx="16" ry="6" fill="#70421f" />
  <ellipse cx="725" cy="301" rx="14" ry="5" fill="#975d36" />
  <ellipse cx="724" cy="300" rx="10" ry="3.5" fill="#b27649" />

  <ellipse cx="765" cy="312" rx="13" ry="5" fill="#70421f" />
  <ellipse cx="765" cy="311" rx="11" ry="4" fill="#975d36" />

