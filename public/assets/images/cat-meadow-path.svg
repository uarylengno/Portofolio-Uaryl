       5. THE MUD PUDDLE (KUBANGAN LUMPUR)
       ========================================== -->
  <!-- Layer 1: Dark Brown Shadow Border -->
  <path d="M 92 260 C 85 240, 130 225, 205 218 C 285 210, 360 200, 480 196 C 620 192, 740 198, 830 215 C 910 230, 940 250, 915 272 C 890 295, 830 305, 760 302 C 700 300, 680 318, 560 326 C 450 334, 340 332, 260 330 C 180 328, 140 315, 120 295 C 100 278, 88 270, 92 260 Z"
